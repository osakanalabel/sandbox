<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デモアプリ集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
    color: #eee;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .container {
    max-width: 900px;
    width: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 50px;
  }

  h1 {
    font-size: 2.8rem;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
    background: linear-gradient(90deg, #e96cff, #5eecff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 1rem;
    color: #aaa;
    letter-spacing: 0.05em;
  }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 40px;
  }

  .app-card {
    background: rgba(22, 33, 62, 0.6);
    border: 1px solid #334;
    border-radius: 16px;
    padding: 32px 24px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    gap: 16px;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }

  .app-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(233, 108, 255, 0.1) 0%, rgba(94, 236, 255, 0.1) 100%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .app-card:hover {
    border-color: #5eecff;
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(94, 236, 255, 0.15);
  }

  .app-card:hover::before {
    opacity: 1;
  }

  .app-card.coming-soon {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .app-icon {
    font-size: 2.4rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app-title {
    font-size: 1.5rem;
    font-weight: bold;
    color: #e96cff;
  }

  .app-description {
    font-size: 0.95rem;
    color: #bbb;
    flex-grow: 1;
    line-height: 1.5;
  }

  .app-link {
    display: inline-block;
    padding: 10px 20px;
    background: linear-gradient(135deg, #e96cff, #5eecff);
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    text-align: center;
  }

  .app-link:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(233, 108, 255, 0.3);
  }

  .app-link:active {
    transform: scale(0.98);
  }

  .app-link.coming {
    background: #334;
    color: #888;
    cursor: default;
    pointer-events: none;
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    background: #e96cff;
    color: #1a1a2e;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .badge.coming {
    background: #556;
    color: #bbb;
  }

  footer {
    text-align: center;
    color: #666;
    font-size: 0.85rem;
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid #333;
    width: 100%;
  }

  @media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .apps-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>デモアプリ集</h1>
    <p class="tagline">楽しいWEBアプリケーション</p>
  </header>

  <div class="apps-grid">
    <!-- あみだくじ -->
    <div class="app-card">
      <div class="badge">公開中</div>
      <div class="app-icon">🪜</div>
      <div class="app-title">あみだくじ</div>
      <p class="app-description">
        古典的な日本の抽選ゲーム。参加者の名前をクリックしてルートを辿り、景品を獲得します。
      </p>
      <a href="amida.html" class="app-link">遊ぶ</a>
    </div>

    <!-- Coming Soon 1 -->
    <div class="app-card coming-soon">
      <div class="badge coming">準備中</div>
      <div class="app-icon">🎰</div>
      <div class="app-title">スロットマシン</div>
      <p class="app-description">
        クラシックなスロットマシンゲーム。運試しに挑戦しよう。
      </p>
      <button class="app-link coming">準備中</button>
    </div>

    <!-- Coming Soon 2 -->
    <div class="app-card coming-soon">
      <div class="badge coming">準備中</div>
      <div class="app-icon">🎲</div>
      <div class="app-title">サイコロゲーム</div>
      <p class="app-description">
        複数人で遊べるサイコロゲーム。戦略と運が必要です。
      </p>
      <button class="app-link coming">準備中</button>
    </div>

    <!-- Coming Soon 3 -->
    <div class="app-card coming-soon">
      <div class="badge coming">準備中</div>
      <div class="app-icon">🃏</div>
      <div class="app-title">トランプゲーム</div>
      <p class="app-description">
        クラシックなカードゲーム。友達と一緒に楽しめます。
      </p>
      <button class="app-link coming">準備中</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Demo Apps. All apps are fun and interactive.</p>
  </footer>
</div>

</body>
</html>
