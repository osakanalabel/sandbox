<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デモアプリ集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 40px;
    text-align: center;
    background: linear-gradient(90deg, #e96cff, #5eecff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .apps-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .app-item {
    display: flex;
    align-items: center;
    padding: 16px;
    background: #16213e;
    border: 1px solid #334;
    border-radius: 8px;
    gap: 16px;
    transition: all 0.2s;
  }

  .app-item:hover {
    border-color: #5eecff;
    background: #1a2a4e;
  }

  .app-item.disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .app-item.disabled:hover {
    border-color: #334;
    background: #16213e;
  }

  .app-name {
    flex: 1;
    font-size: 1rem;
    font-weight: 500;
  }

  .app-link {
    padding: 6px 16px;
    background: #e96cff;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.1s;
  }

  .app-link:hover:not(:disabled) {
    transform: scale(1.05);
  }

  .app-link:active {
    transform: scale(0.95);
  }

  .app-link:disabled {
    background: #556;
    color: #999;
    cursor: default;
  }
</style>
</head>
<body>

<div class="container">
  <h1>デモアプリ集</h1>

  <div class="apps-list">
    <div class="app-item">
      <div class="app-name">あみだくじ</div>
      <a href="amida.html" class="app-link">開く</a>
    </div>

    <div class="app-item disabled">
      <div class="app-name">xxxx</div>
      <button class="app-link" disabled>準備中</button>
    </div>

    <div class="app-item disabled">
      <div class="app-name">xxxx</div>
      <button class="app-link" disabled>準備中</button>
    </div>

    <div class="app-item disabled">
      <div class="app-name">xxxx</div>
      <button class="app-link" disabled>準備中</button>
    </div>
  </div>
</div>

</body>
</html>
